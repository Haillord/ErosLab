name: ErosLab Bot
on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Cache Python packages
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
          
      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browser
        run: playwright install chromium --with-deps

      - name: Setup yt-dlp + ffmpeg
        run: |
          pip install yt-dlp
          # Static ffmpeg (быстрее, чем apt-get)
          wget -q https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz
          tar -xf ffmpeg-release-amd64-static.tar.xz
          sudo cp ffmpeg-*-static/ffmpeg ffmpeg-*-static/ffprobe /usr/local/bin/
          rm -rf ffmpeg-*-static ffmpeg-release-amd64-static.tar.xz
          ffmpeg -version

      - name: Install fonts for drawtext filter
        run: sudo apt-get install -y fonts-dejavu-core --no-install-recommends -qq

      - name: Run ErosLab Bot (CivitAI)
        env:
          # ── Хранилище ──────────────────────────────────────────────────
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
          # ── Telegram ───────────────────────────────────────────────────
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          ADMIN_USER_ID: ${{ secrets.ADMIN_USER_ID }}
          # ── CivitAI ────────────────────────────────────────────────────
          CIVITAI_API_KEY: ${{ secrets.CIVITAI_API_KEY }}
          # ── Rule34 ─────────────────────────────────────────────────────
          R34_API_KEY: ${{ secrets.R34_API_KEY }}
          R34_USER_ID: ${{ secrets.R34_USER_ID }}
          RULE34_MIN_SCORE: "10"
          R34V_PHPSESSID: ${{ secrets.R34V_PHPSESSID }}
          R34V_KT_ACCTOKEN: ${{ secrets.R34V_KT_ACCTOKEN }}
          # ── Настройки бота ─────────────────────────────────────────────
          REVIEW_MODE: "false"
          ALLOW_MATURE_FALLBACK: "false"
          ENABLE_VIDEO_QOS: "true"
          MIN_BITRATE_480P: "900"
          MIN_BITRATE_720P: "1400"
          MIN_BITRATE_1080P: "2200"
          # ── AI Caption ─────────────────────────────────────────────────
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ENABLE_AI_CAPTION: "true"
          ENABLE_AI_CTA: "true"
          AI_DRY_RUN: "false"
          AI_PROVIDER: "auto"
          AI_TIMEOUT_SEC: "12"
          GROQ_MODEL: "llama-3.3-70b-versatile"
          OPENROUTER_MODEL: "openai/gpt-4o-mini"
          ENABLE_STYLE_BLOCK: "true"
          STYLE_BLOCK_MAX_ITEMS: "3"
          CAPTION_STYLE: "minimal"
          STATS_TZ: "Europe/Moscow"
        run: python eroslab_bot.py
