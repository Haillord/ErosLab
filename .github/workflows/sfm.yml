name: SFM Bot
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Cache Python packages
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
          
      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Setup ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg --no-install-recommends

      - name: Run SFM Bot
        env:
          # ── Хранилище ──────────────────────────────────────────────────
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
          # ── Telegram (общий бот, но SFM канал) ─────────────────────────
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID_SFM: ${{ secrets.TELEGRAM_CHANNEL_ID_SFM }}
          # ── CivitAI ────────────────────────────────────────────────────
          CIVITAI_API_KEY: ${{ secrets.CIVITAI_API_KEY }}
          # ── AI Caption ─────────────────────────────────────────────────
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ENABLE_AI_CAPTION: "true"
          ENABLE_AI_CTA: "true"
          AI_DRY_RUN: "false"
          AI_PROVIDER: "auto"
          AI_TIMEOUT_SEC: "12"
          GROQ_MODEL: "llama-3.3-70b-versatile"
          OPENROUTER_MODEL: "openai/gpt-4o-mini"
          ENABLE_STYLE_BLOCK: "true"
          STYLE_BLOCK_MAX_ITEMS: "3"
          CAPTION_STYLE: "minimal"
          STATS_TZ: "Europe/Moscow"
        run: python sfm_bot.py