name: Fetch AI Videos from Rule34

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Number of AI videos to download"
        required: false
        default: "10"
        type: string

jobs:
  fetch-ai-videos:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install ffmpeg (for ffprobe)
        run: |
          wget -q https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
          tar -xf ffmpeg-master-latest-linux64-gpl.tar.xz
          sudo cp ffmpeg-master-latest-linux64-gpl/bin/ffmpeg ffmpeg-master-latest-linux64-gpl/bin/ffprobe /usr/local/bin/
          rm -rf ffmpeg-master-latest-linux64-gpl ffmpeg-master-latest-linux64-gpl.tar.xz
          ffprobe -version

      - name: Install fonts + fontconfig for drawtext filter
        run: sudo apt-get install -y fontconfig fonts-dejavu-core --no-install-recommends -qq

      - name: Fetch AI videos
        env:
          R34_USER_ID: ${{ secrets.R34_USER_ID }}
          R34_API_KEY: ${{ secrets.R34_API_KEY }}
          # rule34_api должен пропустить ВСЕ посты, фильтр по score делаем в fetch_ai_videos.py
          RULE34_MIN_SCORE: "0"
        run: python fetch_ai_videos.py

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-videos
          path: |
            ai_videos/
            report.json